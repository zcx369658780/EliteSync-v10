 x="942" y="476" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#2b5960">资料用途与权限</text><text x="942" y="501" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#4e7577">已有有效资料可在授权内复用；</text><text x="942" y="525" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#4e7577">本页不自动修改对外匹配形象，</text><text x="942" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#4e7577">也不会扩大资料公开范围。</text><rect x="929" y="600" width="290" height="68" rx="13" fill="#dceae6" stroke="none" stroke-width="1"/><text x="942" y="627" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2f6570">保存成功后</text><text x="942" y="650" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#5f8181">直接返回原匹配准备并刷新状态</text><rect x="929" y="683" width="290" height="61" rx="18" fill="#2f8478" stroke="none" stroke-width="1"/><text x="1074" y="720" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="720" text-anchor="middle" fill="#ffffff">保存并返回匹配</text><text x="932" y="780" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="510" text-anchor="start" fill="#5f8380">保存失败：停留本页，保留输入并重试</text><rect x="928" y="805" width="291" height="70" rx="13" fill="#cee4e0" stroke="none" stroke-width="1"/><text x="942" y="834" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="720" text-anchor="start" fill="#3d6f72">明确不会自动报名真实匹配</text><text x="942" y="857" font-family="Noto Sans CJK SC, sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#5f8481">实人核验服务仍未接入</text><rect x="45" y="1004" width="1206" height="60" rx="19" fill="#c3e0d9" stroke="none" stroke-width="1"/><text x="62" y="1029" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="730" text-anchor="start" fill="#23545d">最短合法路径</text><text x="62" y="1051" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="540" text-anchor="start" fill="#376a6d">匹配缺字段 → 此页补充 → 保存成功返回原任务；失败可恢复，任何保存都不自动授权匹配或对外公开。</text></svg>
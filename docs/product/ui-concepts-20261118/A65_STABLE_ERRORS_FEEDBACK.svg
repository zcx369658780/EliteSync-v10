<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 664" width="1400" height="664"><rect x="0" y="0" width="1400" height="664" rx="0" fill="#d5e9e5" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1400" height="75" rx="0" fill="#224c54" stroke="none" stroke-width="1.5"/><text x="27" y="47" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="24" font-weight="700" fill="#f2f9f6">A6.5｜异常页稳定可截图、容易退出、主动反馈：四状态结构校正</text><rect x="24" y="103" width="320" height="480" rx="22" fill="#ebf5f1" stroke="#648b8b" stroke-width="1.5"/><rect x="33" y="113" width="302" height="65" rx="15" fill="#c8e3db" stroke="none" stroke-width="1.5"/><text x="46" y="153" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#214950">01 保存失败</text><rect x="40" y="199" width="288" height="75" rx="10" fill="#e6e5d9" stroke="none" stroke-width="1.5"/><text x="51" y="228" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">本次未确认成功</text><text x="51" y="253" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">留在原编辑上下文</text><rect x="40" y="285" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="51" y="314" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">先查当前服务端状态</text><text x="51" y="339" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">确认后安全重试</text><rect x="40" y="371" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="51" y="400" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">复制非敏感问题摘要</text><text x="51" y="425" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">用户可自行截图</text><rect x="40" y="457" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="51" y="486" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">随时返回/取消</text><text x="51" y="511" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">未保存资料先提示</text><rect x="43" y="515" width="282" height="48" rx="19" fill="#2d786d" stroke="none" stroke-width="1.5"/><text x="52" y="544" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#ffffff">检查结果 / 重试</text><rect x="369" y="103" width="320" height="480" rx="22" fill="#ebf5f1" stroke="#648b8b" stroke-width="1.5"/><rect x="378" y="113" width="302" height="65" rx="15" fill="#c8e3db" stroke="none" stroke-width="1.5"/><text x="391" y="153" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#214950">02 授权或版本冲突</text><rect x="385" y="199" width="288" height="75" rx="10" fill="#e6e5d9" stroke="none" stroke-width="1.5"/><text x="396" y="228" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">当前版本发生变化</text><text x="396" y="253" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">不能覆盖较新事实</text><rect x="385" y="285" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="396" y="314" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">保留有权的本次编辑</text><text x="396" y="339" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">不自动恢复已撤回授权</text><rect x="385" y="371" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="396" y="400" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">查看差异与影响</text><text x="396" y="425" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">先核对当前权限</text><rect x="385" y="457" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="396" y="486" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">可退出或反馈</text><text x="396" y="511" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">不要强制等待</text><rect x="388" y="515" width="282" height="48" rx="19" fill="#2d786d" stroke="none" stroke-width="1.5"/><text x="397" y="544" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#ffffff">检查最新版本</text><rect x="714" y="103" width="320" height="480" rx="22" fill="#ebf5f1" stroke="#648b8b" stroke-width="1.5"/><rect x="723" y="113" width="302" height="65" rx="15" fill="#c8e3db" stroke="none" stroke-width="1.5"/><text x="736" y="153" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#214950">03 权限失效 / 切账号</text><rect x="730" y="199" width="288" height="75" rx="10" fill="#e8e1d8" stroke="none" stroke-width="1.5"/><text x="741" y="228" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">私人内容立即隐藏</text><text x="741" y="253" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">不保留失权界面</text><rect x="730" y="285" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="741" y="314" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">非敏感错误摘要保持</text><text x="741" y="339" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">可复制 / 设备截图</text><rect x="730" y="371" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="741" y="400" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">旧账号缓存不展示</text><text x="741" y="425" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">不能为了截图泄漏数据</text><rect x="730" y="457" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="741" y="486" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">退出不受阻挡</text><text x="741" y="511" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">回到安全页面</text><rect x="733" y="515" width="282" height="48" rx="19" fill="#2d786d" stroke="none" stroke-width="1.5"/><text x="742" y="544" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#ffffff">返回安全页面</text><rect x="1059" y="103" width="320" height="480" rx="22" fill="#ebf5f1" stroke="#648b8b" stroke-width="1.5"/><rect x="1068" y="113" width="302" height="65" rx="15" fill="#c8e3db" stroke="none" stroke-width="1.5"/><text x="1081" y="153" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#214950">04 用户主动反馈</text><rect x="1075" y="199" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="1086" y="228" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">先检查描述与附件</text><text x="1086" y="253" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">截图/日志默认不上传</text><rect x="1075" y="285" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="1086" y="314" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">只允许当前有权账号</text><text x="1086" y="339" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">访客不能站内提交</text><rect x="1075" y="371" width="288" height="75" rx="10" fill="#d8eae5" stroke="none" stroke-width="1.5"/><text x="1086" y="400" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">可以移除敏感附件</text><text x="1086" y="425" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">用户明确确认后发送</text><rect x="1075" y="457" width="288" height="75" rx="10" fill="#e6e5d9" stroke="none" stroke-width="1.5"/><text x="1086" y="486" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" fill="#234d53">提交失败保留当前草稿</text><text x="1086" y="511" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500" fill="#4e7374">不承诺自动存24小时</text><rect x="1078" y="515" width="282" height="48" rx="19" fill="#2d786d" stroke="none" stroke-width="1.5"/><text x="1087" y="544" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#ffffff">确认提交反馈</text><text x="30" y="626" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="500" fill="#234d53">不设置倒计时自动关闭；也不假设已实现“24小时留存”、真实错误编号、自动脱敏上传或无条件重试。</text></svg>
map $http_upgrade $staging_upgrade {
    default upgrade;
    ''      close;
}

# Omit URI, query string and Authorization from access logs.
log_format staging '$time_iso8601 $request_method $status $request_time '
                   '$upstream_addr $upstream_status upgrade=$http_upgrade';
limit_conn_zone $binary_remote_addr zone=staging_ws:1m;

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/r0_tls_certificate;
    ssl_certificate_key /run/secrets/r0_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /dev/stdout staging;
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/v1/messages/ws/[0-9]+$ {
        if ($http_upgrade !~* ^websocket$) { return 426; }
        limit_conn staging_ws 12;
        set $gateway staging-ws:8081;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $staging_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 3s;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 185s;
        set $fpm staging-app:9000;
        fastcgi_pass $fpm;
    }
}

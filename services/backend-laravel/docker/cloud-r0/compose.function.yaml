# Only for the local function fixture. Compose creates separate networks and volumes.
name: elitesync-v2-function

services:
  r0-db:
    command: ["--server-id=2621121"]
    environment:
      MARIADB_DATABASE: elitesync_v2_function
      MARIADB_USER: elitesync_function_app
  r0-app:
    environment:
      DB_DATABASE: elitesync_v2_function
      DB_USERNAME: elitesync_function_app
      V2_SYNTHETIC_CONNECTION_ENABLED: 'true'
      MEDIA_STORAGE_DISK: v1011_relationship
      V2_FUNCTION_RUNTIME: local-v2-function
      V2_FUNCTION_MARIADB_IDENTITY_ENABLED: 'true'
    secrets: [v2_function_identity_key]
  r0-worker:
    environment:
      DB_DATABASE: elitesync_v2_function
      DB_USERNAME: elitesync_function_app

secrets:
  v2_function_identity_key:
    file: ${R0_SECRET_DIR:?Set the local function secret directory}/mariadb-fixture-identity.hex

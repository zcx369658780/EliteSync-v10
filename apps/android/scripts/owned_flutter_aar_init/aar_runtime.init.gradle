import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.attribute.BasicFileAttributes
import java.security.MessageDigest

def rejectOwned = { boolean ok, String reason ->
    if (!ok) throw new GradleException('OWNED_AAR_INIT_REJECTED: ' + reason)
}
def checkedOwnedPath = { Object value ->
    rejectOwned(value != null && !value.toString().isEmpty(), 'missing absolute context path')
    File file = new File(value.toString())
    def path = file.toPath()
    rejectOwned(file.isAbsolute() && path == path.normalize() && Files.exists(path), 'unsafe context path')
    for (def part = path; part != null; part = part.parent) {
        def attributes = Files.readAttributes(part, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
        rejectOwned(!Files.isSymbolicLink(part) && !attributes.isOther(), 'redirected context path')
    }
    rejectOwned(path.toRealPath() == path.normalize(), 'noncanonical context path')
    file
}
def pinnedOwnedFile = { File root, String relative, String expected ->
    File file = checkedOwnedPath(new File(root, relative).absolutePath)
    rejectOwned(file.isFile(), 'missing pinned context file')
    def digest = MessageDigest.getInstance('SHA-256').digest(file.bytes)
        .collect { String.format('%02x', it & 0xff) }.join()
    rejectOwned(digest == expected, 'pinned context file mismatch')
}
